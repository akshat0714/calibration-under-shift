dataset:
  name: kromp
  root: data/raw/kromp/files
  manifest: data/splits/kromp.csv
  num_classes: 2
  class_names: [other, high-quality]
  blocked_until: author-verified patient map and annotation conflict resolution
model:
  backbone: mobilenet_v3_large
  pretrained: true
  dropout: 0.20
  input_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  interpolation: bilinear
  crop_pct: 0.9655172414
training:
  seed: 2025
  seeds: [2025, 2026, 2027]
  deterministic: true
  device: auto
  batch_size: 48
  num_workers: 4
  head_epochs: 5
  finetune_epochs: 25
  head_lr: 0.001
  finetune_lr: 0.0001
  weight_decay: 0.0001
  patience: 5
evaluation:
  batch_size: 48
  num_workers: 4
  corruption_seed: 1729
  corruptions:
    [defocus_blur, motion_blur, gaussian_noise, shot_noise, jpeg, resample, illumination]
  severities: [1, 2, 3, 4, 5]
  calibration_bins: 15
  conformal_alpha: 0.10
  mc_dropout_passes: 30
  risk_coverage_target: 0.80
outputs:
  runs_dir: results/runs
  checkpoints_dir: results/checkpoints
  cache_dir: results/cache
