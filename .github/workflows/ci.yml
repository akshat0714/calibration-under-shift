name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint, format, and shell syntax
        run: |
          ruff check .
          ruff format --check .
          bash -n run.sh scripts/download_data.sh
      - name: Unit and smoke tests
        run: python -m pytest -q
      - name: One-command synthetic integration
        run: CALIBRATION_PYTHON=python bash run.sh --demo
      - name: Restart-and-run walkthrough notebook
        run: |
          CALIBRATION_NOTEBOOK_ALLOW_DEMO=1 \
          CALIBRATION_NOTEBOOK_METRICS=results/demo_metrics.csv \
          CALIBRATION_NOTEBOOK_THRESHOLDS=results/demo_thresholds.csv \
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          path = Path("notebooks/01_walkthrough.ipynb")
          notebook = nbformat.read(path, as_version=4)
          NotebookClient(notebook, timeout=120, kernel_name="python3").execute(cwd=str(Path.cwd()))
          print(f"executed {len(notebook.cells)} cells")
          PY
