[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calibration-under-shift"
version = "0.1.0"
description = "Calibration, uncertainty, and selective prediction under simulated diagnostic-imaging device shift"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Akshat" }]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "slow: marks tests that require model training or network access",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
